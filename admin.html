<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração - Loppiano Dashboard</title>

<link rel="stylesheet" href="./css/style.css" />
<style>#painel{ display:none; }</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>
window.verificarLogin();
</script>

</head>

<body>

<div class="auth-shell">
<div class="auth-card">

  <div class="auth-logo">
    <img
      src="img/logo.png"
      alt="Loppiano"
      onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'"
    />
    <div id="logo-fallback" class="auth-logo-fallback">LP</div>
  </div>

  <div id="login">

    <h2>Área Administrativa</h2>

    <div class="info">
      Digite a senha para acessar.
    </div>

    <input
      type="password"
      id="senha"
      placeholder="Digite a senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

  </div>

  <div id="painel">

    <h2>Importação de Dados</h2>

    <p><strong>Operação Mensal</strong></p>

    <input
      type="file"
      id="operacao"
      accept=".xlsx,.xls"
    >

    <p><strong>Metas</strong></p>

    <input
      type="file"
      id="metas"
      accept=".xlsx,.xls"
    >

    <button onclick="atualizar()">
      Atualizar Dados
    </button>

  </div>

  <div class="auth-credit">
    Desenvolvido por
    <img src="img/logo-paleta.png" alt="Paleta Food Mkt" onerror="this.style.display='none'">
    — marketing e tecnologia
  </div>

</div>
</div>

<script>

function entrar(){

  const senha =
    document.getElementById('senha').value

  if(senha === 'loppiano123'){

    document.getElementById('login').style.display = 'none'
    document.getElementById('painel').style.display = 'block'

  }else{

    alert('Senha inválida')

  }

}

async function atualizar(){

  const operacao =
    document.getElementById('operacao').files[0]

  const metas =
    document.getElementById('metas').files[0]

  const formData = new FormData()

  formData.append('operacao', operacao)
  formData.append('metas', metas)

  const resposta = await fetch('/importar', {
    method: 'POST',
    body: formData
  })

  const resultado = await resposta.json()

  console.log(resultado)

  alert(JSON.stringify(resultado, null, 2))

}

</script>

</body>
</html>
