<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração - Loppiano Dashboard</title>

<style>

body{
  margin:0;
  padding:0;
  background:#111827;
  color:#ffffff;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:420px;
  background:#1f2937;
  padding:30px;
  border-radius:12px;
  box-sizing:border-box;
}

h2{
  margin-top:0;
}

input[type="password"],
input[type="file"]{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:10px;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#painel{
  display:none;
}

.info{
  font-size:14px;
  color:#d1d5db;
  margin-bottom:20px;
}

</style>

</head>

<body>

<div class="card">

  <div id="login">

    <h2>Área Administrativa</h2>

    <div class="info">
      Digite a senha para acessar.
    </div>

    <input
      type="password"
      id="senha"
      placeholder="Digite a senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

  </div>

  <div id="painel">

    <h2>Importação de Dados</h2>

    <p><strong>Operação Mensal</strong></p>

    <input
      type="file"
      id="operacao"
      accept=".xlsx,.xls"
    >

    <p><strong>Metas</strong></p>

    <input
      type="file"
      id="metas"
      accept=".xlsx,.xls"
    >

    <button onclick="atualizar()">
      Atualizar Dados
    </button>

  </div>

</div>

<script>

function entrar(){

  const senha =
    document.getElementById('senha').value

  if(senha === 'loppiano123'){

    document.getElementById('login').style.display = 'none'
    document.getElementById('painel').style.display = 'block'

  }else{

    alert('Senha inválida')

  }

}

function atualizar(){

  const operacao =
    document.getElementById('operacao').files[0]

  const metas =
    document.getElementById('metas').files[0]

  const nomeOperacao =
    operacao ? operacao.name : 'nenhum arquivo'

  const nomeMetas =
    metas ? metas.name : 'nenhum arquivo'

  alert(
    'Operação: ' +
    nomeOperacao +
    '\n\nMetas: ' +
    nomeMetas
  )

}

</script>

</body>
</html>
